spring:
  application:
    name: hotel-search-tracking-service
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  datasource:
    url: ${ORACLE_JDBC_URL}
    username: ${ORACLE_APP_USER}
    password: ${ORACLE_APP_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: hotel-search-persistence
      auto-offset-reset: earliest
      enable-auto-commit: false
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: com.riu.hotelsearch.infrastructure.adapter.out.kafka.SearchEventMessage
        spring.json.trusted.packages: com.riu.hotelsearch.infrastructure.adapter.out.kafka
    listener:
      ack-mode: record
      concurrency: 3

app:
  kafka:
    topic: ${KAFKA_TOPIC}
    partitions: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
